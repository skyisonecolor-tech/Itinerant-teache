<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>순회교사 배치 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--line:#e3e6eb;--line2:#cdd3dc;--ink:#1c2230;--muted:#6b7280;
  --accent:#2f5fd0;--accent-soft:#e9effc;
  --need:#cf3d46;--need-soft:#fdeced;--offer:#2563c9;--offer-soft:#e8f0fd;
  --warn:#b86e00;--warn-soft:#fff3d6;--ok:#16834a;--ok-soft:#e4f5eb;--free:#7446c0;--free-soft:#f1eafc;
  --z1:#eef4ff;--z2:#effaf3;--z3:#fff6ec;--z4:#f4f4f6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Pretendard,'맑은 고딕','Malgun Gothic','Noto Sans CJK KR',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;height:58px}
.brand{font-weight:700;font-size:15.5px;white-space:nowrap;line-height:1.2}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
nav.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button:hover{background:#f1f3f6}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.gear{border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.gear:hover{background:#f1f3f6}
main{padding:18px 20px 40px;max-width:1800px;margin:0 auto}
.tabpane{display:none}.tabpane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 10px;font-size:14.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:#f4f6f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#264fb2}
.btn.danger{color:var(--need)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;background:#fff}
input[type=number]{width:64px}
textarea{width:100%;resize:vertical}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi.bad .v{color:var(--need)}.kpi.good .v{color:var(--ok)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:#eef0f3;color:#4b5563}
.pill.need{background:var(--need-soft);color:var(--need)}
.pill.offer{background:var(--offer-soft);color:var(--offer)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.free{background:var(--free-soft);color:var(--free)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}

/* 공통 표 */
table.grid{border-collapse:collapse;font-size:12.5px;background:#fff}
table.grid th,table.grid td{border:1px solid var(--line2);padding:4px 6px;text-align:center;vertical-align:middle}
table.grid thead th{background:#f3f5f8;font-weight:600;position:sticky;top:0;z-index:2}
table.grid th.zone{writing-mode:vertical-rl;letter-spacing:4px;font-weight:700;width:28px}
.zc0{background:var(--z1)!important}.zc1{background:var(--z2)!important}.zc2{background:var(--z3)!important}.zc3,.zc4,.zc5{background:var(--z4)!important}
.scroll{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:10px}

/* 배치 탭 */
.assign-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1100px){.assign-layout{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
table.mx{font-size:12px}
table.mx th.sn{min-width:58px;max-width:64px;font-size:11.5px;line-height:1.25;word-break:keep-all}
table.mx th.rn{text-align:left;white-space:nowrap;padding:3px 8px;font-weight:600;background:#fafbfc;position:sticky;left:28px;z-index:1}
table.mx tbody th.zone{position:sticky;left:0;z-index:1}
table.mx thead tr.r1 th{top:0;height:34px}
table.mx thead tr.r2 th{top:34px;height:24px}
table.mx thead tr.r3 th{top:58px}
table.mx th.corner{left:0;z-index:4!important;font-size:11px;line-height:1.5;min-width:150px}
table.mx th.corner .cg{color:#c2410c;text-align:left}table.mx th.corner .cr{color:#1d4ed8;text-align:right}
table.mx th.big{font-size:15px;font-weight:800;letter-spacing:1px}
table.mx th.big.recv{background:#dce8fb!important;color:#1d4ed8}
table.mx tbody th.big.give{background:#fde5d3;color:#c2410c;position:sticky;left:0;z-index:2;width:34px;min-width:34px;padding:6px 2px}
table.mx th.big.give span{writing-mode:vertical-rl;letter-spacing:4px;display:inline-block}
table.mx tbody th.zone{left:34px!important}
table.mx th.rn{left:62px!important}
table.mx .give-t{background:#fdeee3!important;color:#c2410c}
table.mx .recv-t{background:#e5eefc!important;color:#1d4ed8}
table.mx th.sn{line-height:1.2}
table.mx td.c{min-width:58px;height:34px;cursor:pointer;padding:2px 3px;line-height:1.25}
table.mx td.c:hover{background:#f2f6ff;outline:2px solid #a9c0f3;outline-offset:-2px}
table.mx td.self{background:repeating-linear-gradient(135deg,#f3f4f6 0 4px,#fafafa 4px 8px);cursor:default}
table.mx td.self:hover{outline:0;background:repeating-linear-gradient(135deg,#f3f4f6 0 4px,#fafafa 4px 8px)}
table.mx td.tot,table.mx th.tot{font-weight:700;background:#f7f8fa}
table.mx .it{white-space:nowrap}
table.mx .it.free{color:var(--free);font-weight:600}
table.mx .it.fixed::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#64748b;margin-left:3px;vertical-align:middle}
table.mx .it.rule{background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:4px;padding:0 3px;outline:1px solid #f0c66b}
table.mx .memo-dot{font-size:10px;margin-left:2px;color:#475569}
#pop .w{font-size:11.5px;color:var(--warn);margin:-2px 0 4px}
#pop .memo{width:100%;margin-bottom:8px;font-size:12.5px}
#pop{width:360px}
.chipbtn{border:1px solid #a9c0f3;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.chipbtn:hover{background:#d6e2fb}
.chipbtn.bad{border-color:#f0c66b;background:var(--warn-soft);color:var(--warn)}
.chipbtn.free{border-color:#cdb6f0;background:var(--free-soft);color:var(--free)}
table.st td.nt0{outline:2px solid var(--need);outline-offset:-2px}
table.hs td.ok{background:#e9f7ef}
.tm td input{width:42px;padding:2px;border:0;text-align:center;background:transparent}
.tm td{padding:0!important}
.tm td.near{background:#e9f7ef}.tm td.mid{background:#fff8e6}.tm td.far{background:#fdecec}
table.mx .bad{background:var(--need-soft)!important;color:var(--need)}
table.mx th.sn.bad,table.mx th.rn.bad{box-shadow:inset 0 -3px 0 var(--need)}
table.mx .hasneed{box-shadow:inset 3px 0 0 var(--need)}
.side{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.li{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fbfbfc}
.li .grow{flex:1;min-width:0}
.li b{font-weight:600}
.grp{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfbfc;font-size:12.5px}
.grp .h{font-weight:700;margin-bottom:3px;display:flex;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.form-grid select,.form-grid input{width:100%}

/* 팝오버 / 모달 */
#pop{position:absolute;z-index:60;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.18);padding:12px;width:320px;display:none}
#pop h4{margin:0 0 8px;font-size:13.5px}
#pop .pr{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#pop .pr select{flex:1}
.hint{font-size:12px;color:var(--muted);background:#f7f8fa;border-radius:8px;padding:6px 8px;margin:6px 0}
#modalBg,#drawerBg{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:70;display:none}
#modalBg{z-index:80}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:81;background:#fff;border-radius:14px;width:min(960px,96vw);max-height:86vh;overflow:auto;padding:18px 20px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal h3{margin:0 0 4px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);z-index:72;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
#drawer.on{transform:none}
#drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line)}
#drawer .dh h2{margin:0;font-size:17px}
#drawer .db{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.set-tbl{width:100%;border-collapse:collapse;font-size:13px}
.set-tbl th,.set-tbl td{border-bottom:1px solid var(--line);padding:4px 4px;text-align:left}
.set-tbl th{font-size:12px;color:var(--muted);font-weight:600}
.set-tbl input[type=text]{width:100%}
.upbox{border:1.5px dashed var(--line2);border-radius:10px;padding:12px;background:#fff}
.upbox .t{font-weight:700}
.report{font-size:12.5px;background:#f7f8fa;border-radius:8px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line2);border-radius:99px;padding:2px 4px 2px 8px;background:#fff}
.chip input{border:0;width:70px;padding:2px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1c2230;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:90;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
@media print{#toast{display:none}}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.shbox{border:1.5px dashed var(--line2);border-radius:10px;padding:8px 10px;background:#fff;transition:.15s}
.shbox.done{border-style:solid;border-color:#9fd3b4;background:#f6fcf8}
.upbox.drag{border-color:var(--accent);background:var(--accent-soft)}
.shbox.drag{border-color:var(--accent);background:var(--accent-soft)}
.shbox .t{font-weight:700}
table.hs td.ntd{box-shadow:inset 0 0 0 2px #f2a7ab}
table.hs tr.nodata th.rn,table.hs tr.nodata td{color:#a0a6b0;background:#fafafa}
/* 통계 */
table.st td.n{background:var(--need-soft);color:var(--need);font-weight:700}
table.st td.o{background:var(--offer-soft);color:var(--offer);font-weight:700}
table.st td.no{font-weight:700;background:linear-gradient(135deg,var(--need-soft) 50%,var(--offer-soft) 50%)}
table.st td.no .a{color:var(--need)}table.st td.no .b{color:var(--offer)}
table.st th.rn{text-align:left;white-space:nowrap;background:#fafbfc}
table.st tr.empty-row th.rn,table.st tr.empty-row td{color:#a0a6b0}
table.st td.tn{color:var(--need);font-weight:700}
table.st td.to{color:var(--offer);font-weight:700}
table.st td.d0{color:var(--ok);font-weight:700}
table.st td.dx{color:var(--warn);font-weight:700;background:var(--warn-soft)}
table.st tfoot td,table.st tfoot th{background:#f3f5f8;font-weight:700}
table.st sup{font-size:9px;color:#64748b}
.bars{display:grid;grid-template-columns:70px 1fr 1fr 70px;gap:4px 8px;align-items:center;font-size:12.5px}
.bars .lab{font-weight:600}
.bars .l{display:flex;justify-content:flex-end}
.bars .bar{height:16px;border-radius:4px;min-width:2px}
.bars .bn{background:var(--need)}.bars .bo{background:var(--offer)}
.bars .gap{font-weight:700;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}

/* 시수 현황 */
table.hs td.nt{background:var(--need-soft);color:var(--need);font-weight:700}
table.hs td.hi{background:#fff1df}
table.hs td.lo{background:#e9f7ef}
table.hs td{position:relative;min-width:46px}
table.hs td .rq{position:absolute;top:1px;right:2px;font-size:9px;color:var(--need);font-weight:700}
table.hs th.rn{text-align:left;white-space:nowrap;background:#fafbfc}
table.hs tfoot td,table.hs tfoot th{background:#f3f5f8;font-weight:700}

/* 출력 */
.print-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.print-layout{grid-template-columns:1fr}}
.ctrl .fld{margin-bottom:12px}
.ctrl .fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.previewBox{background:#d9dde3;border-radius:12px;padding:16px;overflow:hidden}
.previewScale{transform-origin:top left}
#printRoot{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.ppage{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18);overflow:hidden;font-family:'맑은 고딕','Malgun Gothic',Pretendard,'Noto Sans CJK KR',sans-serif;color:#000;flex:none}
.ppage.b4{width:364mm;height:257mm;padding:10mm}.ppage.b4 .area{width:344mm;height:237mm;overflow:hidden}
.ppage.a4{width:210mm;height:297mm;padding:15mm 14mm}.ppage.a4 .area{width:182mm;height:267mm;overflow:hidden}
.ppage .fit{transform-origin:top left;display:inline-block}
.ppage.a4 .fit{width:182mm}
.pp-head{display:flex;align-items:flex-end;justify-content:center;position:relative;margin-bottom:8px}
.pp-head h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px}
.pp-head .date{position:absolute;right:0;bottom:2px;font-size:12px}
table.pp{border-collapse:collapse;font-size:11px;color:#000}
table.pp th,table.pp td{border:1px solid #000;padding:2px 3px;text-align:center;vertical-align:middle;line-height:1.25}
table.pp th{background:#eceff3;font-weight:700}
table.pp *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.pp th.big{font-size:15px;letter-spacing:1px}
table.pp th.big.recv,table.pp .recv-t{background:#dce8fb;color:#1d4ed8}
table.pp th.big.give,table.pp .give-t{background:#fde5d3;color:#c2410c}
table.pp th.big.give{width:30px;padding:4px 2px}
table.pp th.big.give span{writing-mode:vertical-rl;letter-spacing:4px}
table.pp th.corner{font-size:9.5px;line-height:1.4;padding:4px}
table.pp th.corner .cg{color:#c2410c;text-align:left}table.pp th.corner .cr{color:#1d4ed8;text-align:right}
table.pp th.zone{writing-mode:vertical-rl;letter-spacing:3px;width:20px}
table.pp th.sn{width:52px;font-size:10px}
table.pp th.rn{white-space:nowrap;text-align:left;padding:2px 5px;background:#f6f7f9}
table.pp td.c{width:52px;height:24px;white-space:nowrap}
table.pp td.self{background:#e6e6e6}
table.pp .tot{font-weight:700}
table.pp tfoot td.tot:last-child{background:#f3f4f6}
.pp-notes{margin-top:8px;font-size:12px;white-space:pre-wrap;line-height:1.6}
/* 학교별 A4 */
.sp{font-size:13px;color:#111}
.sp-top{display:flex;justify-content:space-between;font-size:12px;color:#444;border-bottom:1px solid #999;padding-bottom:4px}
.sp-name{display:flex;align-items:baseline;gap:12px;margin:14px 0 12px}
.sp-name h1{font-size:30px;margin:0;letter-spacing:-.5px}
.sp-name .zt{font-size:13px;color:#555;border:1px solid #999;border-radius:99px;padding:1px 10px}
.sp-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.sp-sum .box{border-radius:8px;padding:10px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sp-sum .box.give{background:#fdeee3;border:1.5px solid #f3b48b}.sp-sum .box.recv{background:#e5eefc;border:1.5px solid #9dbcf2}
.sp-sum .l{font-size:13px;font-weight:700}.sp-sum .give .l{color:#c2410c}.sp-sum .recv .l{color:#1d4ed8}
.sp-sum .v{font-size:28px;font-weight:800;margin-top:2px}.sp-sum .v small{font-size:14px;font-weight:600;margin-left:3px}
.sp-sum .s{font-size:12px;color:#555}
.sp h2{font-size:15.5px;margin:16px 0 6px}.sp h2.give{color:#c2410c}.sp h2.recv{color:#1d4ed8}
.sp-t{width:100%;border-collapse:collapse;font-size:13.5px}
.sp-t th,.sp-t td{border:1px solid #444;padding:6px 6px;text-align:center}
.sp-t *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sp-t.give thead th{background:#fde5d3}.sp-t.recv thead th{background:#dce8fb}
.sp-t td.sch{text-align:left;padding-left:10px;font-weight:600}
.sp-t td.num{font-weight:700}
.sp-t td.none{color:#888;padding:12px}
.sp-t tfoot th{background:#f3f4f6;font-weight:700}
.sp-notes{margin-top:18px;font-size:12px;white-space:pre-wrap;line-height:1.7;border-top:1px solid #ccc;padding-top:8px}
@page{size:364mm 257mm;margin:0}
@media print{
  html,body{background:#fff}
  header.top,#pop,#modal,#modalBg,#drawer,#drawerBg,.no-print,.ctrl,#toast{display:none!important}
  .tabpane{display:none!important}
  #pane-print{display:block!important}
  main{padding:0!important;margin:0!important;max-width:none!important}
  .print-layout{display:block}
  .previewBox{background:none;padding:0;border-radius:0}
  .previewScale{transform:none!important;width:auto!important;height:auto!important}
  #printRoot{display:block}
  .ppage{box-shadow:none;margin:0;break-after:page}
  .ppage:last-child{break-after:auto}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brandTitle">순회교사 배치 도우미<small id="brandSub"></small></div>
  <nav class="tabs" id="tabs">
    <button data-tab="assign" class="on">배치 작업</button>
    <button data-tab="stats">요청·희망 통계</button>
    <button data-tab="hours">학교별·교과별 시수 현황</button>
    <button data-tab="print">출력·다운로드</button>

<script>
'use strict';
/* =========================================================
   기본값
   ========================================================= */
const LS_KEY = 'sunhoe-assign-v1';
const DEFAULT_ZONES = ['연성','은계','정왕'];
const DEFAULT_SCHOOLS = [
  ['논곡중','연성'],['연성중','연성'],['장곡중','연성'],['시흥매화중','연성'],['응곡중','연성'],['시흥능곡중','연성'],['조남중','연성'],['산현중','연성','목감1중'],['시흥가온중','연성'],
  ['대흥중','은계'],['소래중','은계'],['시흥은행중','은계'],['신천중','은계'],['은계중','은계'],
  ['군자중','정왕'],['서해중','정왕'],['송운중','정왕'],['시화중','정왕'],['시흥중','정왕'],['월곶중','정왕'],['정왕중','정왕'],['함현중','정왕'],['배곧중','정왕'],['배곧해솔중','정왕'],['군서미래국제','정왕'],['배곧라라중','정왕'],['시화나래중','정왕']
];
const DEFAULT_SUBJECTS = [
  ['국어'],['수학'],['영어'],['도덕','도덕윤리,윤리'],['사회','일반사회,지리,통합사회'],['역사'],['과학','물리,화학,생물,생명과학,지구과학,통합과학'],['체육'],['스포츠','스포츠클럽'],['음악'],['미술'],
  ['기술가정','기가,기술·가정,기술,가정'],['정보','정보컴퓨터,정보·컴퓨터'],['한문'],['중국어','중어'],['일본어','일어'],['러시아어','러시아'],['진로진학상담','진로상담'],['진로','진로와직업'],['창체','창의적체험활동']
];
const FREE = '자율';
const DEFAULT_NOTES = '⦁ 순회 교사는 1학기와 2학기 동일하게 운영됩니다.\n⦁ 「자율」은 해당교와 협의 후 운영하시면 됩니다.';

function defaultState(){
  let n = 0;
  return {
    v:1, year:new Date().getFullYear(), sem:'1', docDate:todayStr(), notes:DEFAULT_NOTES,
    zones:[...DEFAULT_ZONES],
    schools:DEFAULT_SCHOOLS.map(([name,zone,al])=>({id:'s'+(++n), name:fullSchoolName(name), zone, aliases:al||'', avoid:/군서미래국제/.test(name)})),
    seq:n,
    rule:{maxAvg:16, capAfter:18.5, maxLoop:5, minHours:2},
    geo:{coords:{}, min:{}, at:null, method:''},
    subjects:DEFAULT_SUBJECTS.map(([name,al])=>({name, aliases:al||''})),
    needs:[], offers:[], reqFile:null,
    hours:null,
    plans:{},
    ui:{tab:'assign', onlyActive:true, printOnlyActive:true, printLayout:'matrix', hoursMetric:'h', statsHideEmpty:false}
  };
}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

let S;
function load(){
  try{const t=localStorage.getItem(LS_KEY); if(t){const o=JSON.parse(t); const d=defaultState(); S=Object.assign(d,o); S.ui=Object.assign(d.ui,o.ui||{}); migrate(); return;}}catch(e){}
  S=defaultState();
}
function migrate(){
  S.rule=Object.assign({maxAvg:16,capAfter:18.5},S.rule||{});
  if(S.rule.capAfter===20) S.rule.capAfter=18.5;
  if(S.rule.maxLoop==null||S.rule.maxLoop===4) S.rule.maxLoop=5; if(S.rule.minHours==null) S.rule.minHours=2;
  // 교과 묶음 (사회·과학·기술가정·진로진학상담)
  const SG={'사회':'일반사회,지리,통합사회','과학':'물리,화학,생물,생명과학,지구과학,통합과학','도덕':'도덕윤리,윤리'};
  if(S.subjects.some(x=>x.name==='기가')&&!S.subjects.some(x=>x.name==='기술가정')){
    const ren=r=>{if(r.subject==='기가') r.subject='기술가정'};
    S.needs.forEach(ren); S.offers.forEach(ren); Object.values(S.plans).forEach(l=>l.forEach(ren));
    if(S.hours){Object.values(S.hours.data).forEach(m=>{if(m['기가']){m['기술가정']=m['기가']; delete m['기가']}}); S.hours.subjects=S.hours.subjects.map(x=>x==='기가'?'기술가정':x)}
    S.subjects.find(x=>x.name==='기가').name='기술가정';
  }
  const tg=S.subjects.find(x=>x.name==='기술가정'); if(tg){const al=new Set((tg.aliases||'').split(',').map(a=>a.trim()).filter(Boolean)); ['기가','기술·가정','기술','가정'].forEach(a=>al.add(a)); tg.aliases=[...al].join(',')}
  if(!S.needs.some(r=>r.subject==='가정')&&!S.offers.some(r=>r.subject==='가정')) S.subjects=S.subjects.filter(x=>x.name!=='가정');
  Object.entries(SG).forEach(([k,v])=>{const x=S.subjects.find(y=>y.name===k); if(x){const al=new Set((x.aliases||'').split(',').map(a=>a.trim()).filter(Boolean)); v.split(',').forEach(a=>al.add(a)); x.aliases=[...al].join(',')}});
  if(!S.subjects.some(x=>x.name==='진로진학상담')){const i=S.subjects.findIndex(x=>x.name==='진로'); S.subjects.splice(i<0?S.subjects.length:i,0,{name:'진로진학상담',aliases:'진로상담'})}
  S.hoursSrc=S.hoursSrc||{};
  // 지정교는 사용하지 않음
  S.needs.forEach(r=>r.partner=''); S.offers.forEach(r=>r.partner='');
  S.geo=Object.assign({coords:{},min:{},at:null,method:''},S.geo||{});
  S.schools.forEach(x=>{ if(!/학교$/.test(x.name)) x.name=fullSchoolName(x.name); if(x.avoid===undefined) x.avoid=/군서미래국제/.test(x.name); });
  const sh=S.schools.find(s=>schoolKey(s.name)==='산현');
  if(sh&&!(sh.aliases||'').includes('목감1')) sh.aliases=(sh.aliases?sh.aliases+',':'')+'목감1중';
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const num=v=>{const x=parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isFinite(x)?x:0};
const fmt=x=>{x=Math.round(x*10)/10;return Number.isInteger(x)?String(x):x.toFixed(1)};

/* =========================================================
   학교·교과 이름 처리
   ========================================================= */
const clean=s=>String(s??'').replace(/\s+/g,'');
function normSchoolName(raw){return clean(raw).replace(/중학교$/,'중').replace(/학교$/,'')}
function schoolKey(raw){return normSchoolName(raw).replace(/중$/,'')}
function findSchool(raw){
  const k=schoolKey(raw); if(!k) return null;
  for(const s of S.schools){
    if(schoolKey(s.name)===k) return s;
    if(s.aliases && s.aliases.split(',').some(a=>a.trim() && schoolKey(a)===k)) return s;
  }
  return null;
}
const isExt=id=>typeof id==='string'&&id.startsWith('ext:');
function schoolById(id){return S.schools.find(s=>s.id===id)}
function nameOf(id){if(isExt(id)) return fullSchoolName(id.slice(4)); const s=schoolById(id); return s?fullSchoolName(s.name):'(삭제됨)'}
const isAvoid=id=>{const s=schoolById(id); return !!(s&&s.avoid)};
function zonesOrder(){const z=[...S.zones]; if(S.schools.some(s=>!S.zones.includes(s.zone))) z.push('미지정'); return z}
function zoneOf(id){if(isExt(id)) return '관외'; const s=schoolById(id); if(!s) return '미지정'; return S.zones.includes(s.zone)?s.zone:'미지정'}
function zoneClass(z){const i=zonesOrder().indexOf(z); return 'zc'+(i<0?3:Math.min(i,5))}
function subjKey(raw){return clean(raw).replace(/[·･.\-]/g,'')}
function resolveSubject(raw, addIfMissing=true){
  const k=subjKey(raw); if(!k) return null;
  for(const s of S.subjects){
    if(subjKey(s.name)===k) return s.name;
    if(s.aliases && s.aliases.split(',').some(a=>a.trim() && subjKey(a)===k)) return s.name;
  }
  if(!addIfMissing) return null;
  S.subjects.push({name:clean(raw),aliases:''}); return clean(raw);
}
function subjOrder(name){if(name===FREE) return 9999; const i=S.subjects.findIndex(s=>s.name===name); return i<0?999:i}
const bySubj=(a,b)=>subjOrder(a.subject)-subjOrder(b.subject);

/* =========================================================
   학기 / 계획
   ========================================================= */
function semLabel(){return S.sem==='연간'?'':S.sem+'학기'}
function planTitle(){return `${S.year}학년도 ${semLabel()?semLabel()+' ':''}순회교사 운영계획(안)`}
function planKey(){return S.year+'-'+S.sem}
function assigns(){return S.plans[planKey()]||(S.plans[planKey()]=[])}
function setAssigns(a){S.plans[planKey()]=a}
function semOk(r){
  if(S.sem==='연간') return true;
  const v=clean(r.sem).replace('학기','');
  return !v||v==='연'||v==='연간'||v==='공통'||v===S.sem||v.includes(S.sem);
}
const activeNeeds=()=>S.needs.filter(semOk);
const activeOffers=()=>S.offers.filter(semOk);

/* =========================================================
   원칙: 학교·교과별 평균시수(시수÷교사수) 기준
   ========================================================= */
function hv(id,sub){const H=S.hours; if(!H||isExt(id)) return null; const m=H.data[id]; return (m&&m[sub])||null}
function avgOf(id,sub){const v=hv(id,sub); return v&&v.t?v.h/v.t:null}
function noTeacher(id,sub){const v=hv(id,sub); return !!(v&&v.h>0&&!v.t)}
function eligible(id,sub){const a=avgOf(id,sub); return a!==null&&a<=S.rule.maxAvg+1e-9}
function givenOut(id,sub,except){return assigns().reduce((t,a)=>t+(a.from===id&&a.subject===sub&&a.id!==except?a.hours:0),0)}
function capLeft(id,sub){const v=hv(id,sub); if(!v||!v.t||!eligible(id,sub)) return 0; return Math.max(0,Math.floor(S.rule.capAfter*v.t-v.h-givenOut(id,sub)+1e-9))}
function anyEligible(id){if(!S.hours) return true; const m=S.hours.data[id]||{}; return Object.keys(m).some(s=>eligible(id,s))}
/* 배정 1건의 원칙 위반 사유 (화면 전용) */
function warnOf(a,list){
  list=list||assigns();
  if(isExt(a.from)) return '';
  const av=[a.from,a.to].filter(isAvoid); if(av.length) return `${av.map(nameOf).join('·')}: 순회 참여 제한 학교 — 꼭 필요한 경우인지 확인`;
  if(S.rule.minHours&&a.hours<S.rule.minHours-1e-9){ const cell=list.filter(x=>x.from===a.from&&x.to===a.to).reduce((t,x)=>t+x.hours,0); if(cell<S.rule.minHours-1e-9) return `${fmt(a.hours)}시간 배정 — 최소 ${S.rule.minHours}시간 미만`; }
  if(a.subject===FREE) return '';  // 자율은 어느 교과에서 오든 무관
  if(S.hours){
    const v=hv(a.from,a.subject);
    if(!v) return `${nameOf(a.from)}: 수업시수 자료에 ${a.subject} 없음`;
    if(!v.t) return `${nameOf(a.from)}: ${a.subject} 교사 없음`;
    const avg=v.h/v.t;
    if(avg>S.rule.maxAvg+1e-9) return `${nameOf(a.from)} ${a.subject} 평균 ${fmt(avg)}시간 — 기준 ${S.rule.maxAvg} 초과`;
    const out=list.reduce((t,x)=>t+(x.from===a.from&&x.subject===a.subject?x.hours:0),0);
    const post=(v.h+out)/v.t;
    if(post>S.rule.capAfter+1e-9) return `${nameOf(a.from)} ${a.subject} 지원 후 평균 ${fmt(post)}시간 — 상한 ${S.rule.capAfter} 초과`;
    return '';
  }
  return activeOffers().some(o=>o.school===a.from&&o.subject===a.subject)?'':`${nameOf(a.from)}: ${a.subject} 지원 희망 없음`;
}

/* =========================================================
   이동시간
   ========================================================= */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180; const dl=r(b.lat-a.lat),dn=r(b.lng-a.lng); const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h))}
function estMin(a,b){const c1=S.geo.coords[a],c2=S.geo.coords[b]; if(!c1||!c2) return null; return Math.round(hav(c1,c2)*1.35/28*60+3)}
function travel(a,b){
  if(a===b) return 0; if(isExt(a)||isExt(b)) return null;
  const m=S.geo.min, x=m[a+'|'+b], y=m[b+'|'+a];
  if(x!=null&&y!=null) return Math.round((x+y)/2);
  if(x!=null) return x; if(y!=null) return y;
  return estMin(a,b);
}
const tLabel=(a,b)=>{const t=travel(a,b); return t==null?'—':t+'분'};

/* =========================================================
   현황 계산
   ========================================================= */
function compute(){
  const A=assigns();
  const needTot={},offerTot={},needRem={},offerRem={},give={},recv={};
  const add=(o,a,b,v)=>{(o[a]||(o[a]={}));o[a][b]=(o[a][b]||0)+v};
  activeNeeds().forEach(n=>{add(needTot,n.school,n.subject,n.hours);add(needRem,n.school,n.subject,n.hours)});
  activeOffers().forEach(o=>{add(offerTot,o.school,o.subject,o.hours);add(offerRem,o.school,o.subject,o.hours)});
  const participants=new Set(); const offList=[]; const overList=[];
  A.forEach(a=>{
    give[a.from]=(give[a.from]||0)+a.hours; recv[a.to]=(recv[a.to]||0)+a.hours;
    participants.add(a.from); participants.add(a.to);
    if(a.subject!==FREE){
      add(needRem,a.to,a.subject,-a.hours);
      if(offerTot[a.from]&&offerTot[a.from][a.subject]) add(offerRem,a.from,a.subject,-a.hours);
    }
    const w=warnOf(a); if(w) offList.push([a.id,w]);
  });
  const unmet=[];
  Object.entries(needRem).forEach(([sc,m])=>Object.entries(m).forEach(([sub,v])=>{
    if(v>0.001 && needTot[sc]&&needTot[sc][sub]) unmet.push({school:sc,subject:sub,rem:v});
    if(v<-0.001){ if(needTot[sc]&&needTot[sc][sub]) overList.push({school:sc,subject:sub,over:-v}); }
  }));
  unmet.forEach(u=>u.nt=noTeacher(u.school,u.subject));
  unmet.sort((a,b)=>(b.nt-a.nt)||b.rem-a.rem||subjOrder(a.subject)-subjOrder(b.subject));
  const bal={}; const unbalanced=[];
  [...participants].filter(x=>!isExt(x)).forEach(id=>{bal[id]=(give[id]||0)-(recv[id]||0); if(Math.abs(bal[id])>0.001) unbalanced.push(id)});
  return {needTot,offerTot,needRem,offerRem,give,recv,participants,unmet,bal,unbalanced,warn:new Map(offList),overList};
}

/* =========================================================
   자동 배치 알고리즘
   1) 파일에 지정된 학교(관내 지정 → 관외 지정 순)
   2) 교과가 맞는 교환 고리(사이클) — 짧은 고리(참여 학교 최소) 우선, 같은 권역 우선
   3) 남은 요청 → 지원 희망교 연결
   4) 학교별 줌·받음 차이를 「자율」로 보정
   ========================================================= */
/* 수업시수 자료 기반 자동 배치
   - 우선순위: ① 시수는 있으나 교사가 없는 교과 ② 나머지(시수 큰 순)
   - 지원교 조건: 해당 교과 평균시수(시수÷교사수) ≤ 기준(16). 지원 후 평균이 상한(20)을 넘지 않는 만큼만
   - 후보 순서: 지정 상대교 → 같은 권역 → 맞교환 가능 → 지원 희망 교과 → 이동시간 짧은 순 → 이미 참여 중인 학교
   - 맞교환: 요청교가 지원교에 필요한 교과를 줄 수 있으면 바로 되돌려 줌
   - 남는 차이는 「자율」로 보정 */
function autoAssign(keepManual){ setAssigns(buildPlan(keepManual,null)); }
/* 난수 (재작업마다 다른 조합) */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* 배치안 1개 만들기. rng가 없으면 기본(결정적) 안 */
function buildPlan(keepManual,rng){
  if(!S.hours){const prev=assigns(); autoAssignOffers(keepManual); const r=assigns(); setAssigns(prev); return r;}
  const R0=()=>rng?rng():0;
  const kept=keepManual?assigns().filter(a=>a.kind==='manual'):[];
  const out=kept.map(a=>({...a}));
  const needs=activeNeeds().map(n=>({...n,rem:n.hours}));
  const given={};
  const addGiven=(g,s,h)=>{(given[g]||(given[g]={}));given[g][s]=(given[g][s]||0)+h};
  const takeNeed=(school,subj,h)=>{let left=h; for(const r of needs){if(left<=1e-9) break; if(r.school===school&&r.subject===subj&&r.rem>0){const t=Math.min(r.rem,left); r.rem-=t; left-=t}} return h-left};
  kept.forEach(a=>{ if(a.subject!==FREE){takeNeed(a.to,a.subject,a.hours); addGiven(a.from,a.subject,a.hours);} });
  const addA=(from,to,subject,hours)=>{
    if(hours<=1e-9) return; addGiven(from,subject,hours);

/* (수업시수 자료가 없을 때) 지원 희망만으로 배치 */

  const offers=activeOffers().map(o=>({...o,rem:o.hours}));

  };

  const internalOfferP=offers.filter(o=>o.partner&&!isExt(o.partner));
  internalNeedP.forEach(n=>{ if(n.rem<=0||n.partner===n.school) return; const h=n.rem; n.rem=0; take(offers,n.partner,n.subject,h,false); addA(n.partner,n.school,n.subject,h,'fixed'); });
  internalOfferP.forEach(o=>{ if(o.rem<=0||o.partner===o.school) return; const t=take(needs,o.partner,o.subject,o.rem,false); if(t>0){o.rem-=t; addA(o.school,o.partner,o.subject,t,'fixed');} });
  needs.filter(n=>n.partner&&isExt(n.partner)).forEach(n=>{ if(n.rem<=0) return; addA(n.partner,n.school,n.subject,n.rem,'fixed'); n.rem=0; });
  offers.filter(o=>o.partner&&isExt(o.partner)).forEach(o=>{ if(o.rem<=0) return; addA(o.school,o.partner,o.subject,o.rem,'fixed'); o.rem=0; });

  const internal=S.schools.map(s=>s.id);
  const sumRem=(list,school,subj)=>list.reduce((t,r)=>t+(r.school===school&&r.subject===subj?r.rem:0),0);
  const subjSet=()=>[...new Set([...needs.filter(n=>n.rem>0).map(n=>n.subject)])];

        const o=sumRem(offers,u,s); if(o<=0) continue;

function cmpArr(a,b){for(let i=0;i<a.length;i++){if(a[i]!==b[i]) return a[i]-b[i]} return 0}

function pathLens(list,target){

function balanceFree(list,rng){

/* 배치 결과를 「교환 고리」로 분해 — 짧은 고리부터 */
function loopsOf(A){
  const w={}; A.forEach(a=>{(w[a.from]||(w[a.from]={}));w[a.from][a.to]=(w[a.from][a.to]||0)+a.hours});
  const loops=[];
  const shortest=()=>{
    let best=null;
    for(const s of Object.keys(w)){
      const prev={},q=[];
      Object.keys(w[s]).forEach(v=>{if(w[s][v]>1e-9&&!(v in prev)){prev[v]=s;q.push(v)}});
      for(let i=0;i<q.length;i++){const u=q[i]; if(u===s) break;
        Object.keys(w[u]||{}).forEach(v=>{if(w[u][v]>1e-9&&!(v in prev)){prev[v]=u;q.push(v)}});}
      if(!(s in prev)) continue;
      const path=[s]; let x=prev[s]; while(x!==s){path.unshift(x); x=prev[x]} path.unshift(s);

  };
  for(let g=0;g<200;g++){
    const c=shortest(); if(!c) break;
    for(let i=0;i<c.nodes.length;i++) w[c.path[i]][c.path[i+1]]-=c.f;
    const key=[...c.nodes].sort().join('|')+'#'+c.path.join('>');

function subjectOptions(sel){return [`<option value="${FREE}" ${sel===FREE?'selected':''}>${FREE}</option>`].concat(S.subjects.map(s=>`<option ${s.name===sel?'selected':''}>${esc(s.name)}</option>`)).join('')}

/* 셀 편집 팝오버 */
let popCell=null;
function openPop(td){
  const [from,to]=td.dataset.cell.split('|'); popCell={from,to,td};
  drawPop(); const r=td.getBoundingClientRect(); const p=$('#pop');
  p.style.display='block';
  let left=window.scrollX+r.right+6, top=window.scrollY+r.top;
  if(left+330>window.scrollX+window.innerWidth) left=window.scrollX+r.left-330;
  if(left<window.scrollX+8) left=window.scrollX+8;
  if(top+p.offsetHeight>window.scrollY+window.innerHeight-10) top=Math.max(window.scrollY+8,window.scrollY+window.innerHeight-p.offsetHeight-10);
  p.style.left=left+'px'; p.style.top=top+'px';
}
function hourOptions(sel){const o=[]; for(let i=Math.max(1,S.rule.minHours||1);i<=20;i++) o.push(i); if(sel&&!o.includes(sel)) {o.push(sel); o.sort((a,b)=>a-b)} return o.map(v=>`<option value="${v}" ${v===sel?'selected':''}>${fmt(v)}시간</option>`).join('')}
function popSubjectOptions(from,to,sel){
  const C=compute(); const groups=[];
  const nd=C.needRem[to]?Object.entries(C.needRem[to]).filter(([s,v])=>v>0).map(([s])=>s):[];
  const el=S.hours?S.subjects.map(s=>s.name).filter(s=>!nd.includes(s)&&eligible(from,s)):[];
  const rest=S.subjects.map(s=>s.name).filter(s=>!nd.includes(s)&&!el.includes(s));
  const opt=s=>`<option value="${esc(s)}" ${s===sel?'selected':''}>${esc(s)}</option>`;
  let h='';
  if(nd.length) h+=`<optgroup label="${esc(nameOf(to))} 요청 교과">${nd.map(opt).join('')}</optgroup>`;
  h+=`<optgroup label="요청 교과 아님">${opt(FREE)}</optgroup>`;
  if(el.length) h+=`<optgroup label="${esc(nameOf(from))} 지원 가능 교과(평균 ${S.rule.maxAvg} 이하)">${el.map(opt).join('')}</optgroup>`;
  h+=`<optgroup label="그 밖의 교과">${rest.map(opt).join('')}</optgroup>`;
  return h;
}
function drawPop(){
  if(!popCell) return;
  const {from,to}=popCell; const C=compute();
  const items=assigns().filter(a=>a.from===from&&a.to===to).sort(bySubj);
  let h=`<h4>${esc(nameOf(from))} → ${esc(nameOf(to))}</h4><div class="small muted" style="margin-bottom:8px">${esc(nameOf(from))}에서 ${esc(nameOf(to))}로 순회 지원 · ${esc(zoneOf(from))}→${esc(zoneOf(to))} · 이동 ${tLabel(from,to)}</div>`;
  if(!items.length) h+='<div class="small muted" style="margin-bottom:6px">배정된 항목이 없습니다. 아래에서 고르면 바로 들어갑니다.</div>';
  items.forEach(a=>{const w=C.warn.get(a.id);
    h+=`<div class="pr"><select data-pe="sub" data-id="${a.id}">${popSubjectOptions(from,to,a.subject)}</select><select data-pe="h" data-id="${a.id}" style="width:86px">${hourOptions(a.hours)}</select><button class="btn sm danger" data-pe="del" data-id="${a.id}">삭제</button></div>`;
    if(a.subject!==FREE&&S.hours){const v=hv(from,a.subject); h+=`<div class="small muted" style="margin:-3px 0 4px">${esc(nameOf(from))} ${esc(a.subject)}: ${v?`시수 ${fmt(v.h)} / 교사 ${v.t}명${v.t?` · 평균 ${fmt(v.h/v.t)} → 지원 후 ${fmt((v.h+givenOut(from,a.subject))/v.t)}`:''}`:'자료 없음'}</div>`}
    if(w) h+=`<div class="w">⚠ ${esc(w)}</div>`;
    h+=`<input type="text" class="memo" placeholder="메모${w?' (예외 사유)':''}" value="${esc(a.memo||'')}" data-memo="${a.id}">`;});
  // 추천 칩: 받는 학교의 남은 요청
  const needs=C.needRem[to]?Object.entries(C.needRem[to]).filter(([s,v])=>v>0).sort((x,y)=>subjOrder(x[0])-subjOrder(y[0])):[];
  const chips=needs.map(([s,v])=>{
    let hrs=v, ok=true, why='';
    if(S.hours){const cl=capLeft(from,s); ok=cl>0; if(ok) hrs=Math.min(v,cl); else why=eligible(from,s)?'상한 도달':(hv(from,s)&&hv(from,s).t?`평균 ${fmt(avgOf(from,s))}`:'교사 없음');}
    return `<button class="chipbtn ${ok?'':'bad'}" data-pe="chip" data-sub="${esc(s)}" data-h="${hrs}" title="${ok?'누르면 바로 넣습니다':'원칙 밖: '+why}">${ok?'':'⚠ '}${esc(s)} ${fmt(hrs)}${noTeacher(to,s)?' ★':''}</button>`;
  });
  const bf=(C.recv[from]||0)-(C.give[from]||0), bt=(C.give[to]||0)-(C.recv[to]||0);
  const fz=Math.min(bf,bt);
  if(fz>0) chips.push(`<button class="chipbtn free" data-pe="chip" data-sub="${FREE}" data-h="${fz}" title="${esc(nameOf(from))}이(가) 더 받은 만큼 되돌려 줌">자율 ${fmt(fz)}</button>`);
  if(chips.length) h+=`<div class="small" style="font-weight:600;margin:6px 0 4px">눌러서 넣기 <span class="muted" style="font-weight:400">(${esc(nameOf(to))} 남은 요청${fz>0?' · 균형 맞추기':''}${needs.some(([s])=>noTeacher(to,s))?' · ★ 교사 없음':''})</span></div><div class="chips" style="margin-bottom:8px">${chips.join('')}</div>`;
  else h+=`<div class="hint">${esc(nameOf(to))}의 남은 요청이 없습니다. 보내야 하면 「자율」을 고르세요.</div>`;
  h+=`<div class="small" style="font-weight:600;margin:4px 0">교과·시수 골라 넣기</div><div class="pr"><select id="popSub">${popSubjectOptions(from,to,needs.length?needs[0][0]:FREE)}</select><select id="popH" style="width:86px">${hourOptions(needs.length?needs[0][1]:2)}</select><button class="btn sm primary" data-pe="addsel">넣기</button></div>`;
  h+=`<div class="row" style="margin-top:6px"><button class="btn sm" data-pe="rev">⇄ 반대 방향 (${esc(nameOf(to))} → ${esc(nameOf(from))})</button><span style="flex:1"></span><button class="btn sm" data-pe="close">닫기</button></div>`;
  $('#pop').innerHTML=h;
}
function closePop(){popCell=null;$('#pop').style.display='none'}

/* 지원교 찾기 모달 */
function openFindGiver(school,subject,rem){
  if(!S.hours) return openFindGiverOffers(school,subject,rem);
  const C=compute();
  const OF=activeOffers();
  const rows=S.schools.filter(s=>s.id!==school).map(s=>{
    const id=s.id, v=hv(id,subject), avg=avgOf(id,subject), cl=capLeft(id,subject), tt=travel(id,school);
    const myNeeds=C.needRem[id]?Object.entries(C.needRem[id]).filter(([t,x])=>x>0&&eligible(school,t)).map(([t])=>t):[];
    const off=OF.some(o=>o.school===id&&o.subject===subject);
    return {id,v,avg,cl,tt,myNeeds,off,ok:eligible(id,subject)};
  }).filter(r=>r.v&&r.v.t>0);
  const key=r=>[isAvoid(r.id)?1:0, zoneOf(r.id)===zoneOf(school)?0:1, r.myNeeds.length?0:1, r.off?0:1, r.tt==null?999:r.tt, r.avg];
  const okRows=rows.filter(r=>r.ok&&r.cl>0).sort((a,b)=>cmpArr(key(a),key(b)));
  const fullRows=rows.filter(r=>r.ok&&r.cl<=0);
  const badRows=rows.filter(r=>!r.ok).sort((a,b)=>a.avg-b.avg);
  const nt=noTeacher(school,subject);

/* 학교별 페이지 자료 */
function schoolPages(){
  const A=assigns(); const ids=new Set(A.flatMap(a=>[a.from,a.to]).filter(x=>!isExt(x)));
  const out=[]; zonesOrder().forEach(z=>S.schools.filter(s=>zoneOf(s.id)===z&&ids.has(s.id)).forEach(s=>{
    const ord=allOrder();
    const give=A.filter(a=>a.from===s.id).sort((x,y)=>ord(x.to)-ord(y.to)||bySubj(x,y));
    const recv=A.filter(a=>a.to===s.id).sort((x,y)=>ord(x.from)-ord(y.from)||bySubj(x,y));
    out.push({id:s.id,zone:z,give,recv,g:give.reduce((t,a)=>t+a.hours,0),r:recv.reduce((t,a)=>t+a.hours,0)});
  }));
  return out;
}

function fitPage(){

/* =========================================================
   학교별 수업시수 자료 (엑셀 · PDF · 이미지)
   ========================================================= */
const LIB={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  tess:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',tessw:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',tessc:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1'};
const SUB_GROUP_NOTE='사회 = 일반사회·지리·통합사회 / 과학 = 물리·화학·생물·지구과학·통합과학 / 도덕 = 도덕윤리 / 기술가정 = 기술·가정 / 나머지는 과목별';
function loadScript(src){return new Promise((res,rej)=>{const ex=document.querySelector(`script[data-src="${src}"]`); if(ex){ if(ex.dataset.ok) return res(); ex.addEventListener('load',res); ex.addEventListener('error',()=>rej(new Error('불러오기 실패'))); return;}
  const s=document.createElement('script'); s.src=src; s.dataset.src=src; s.onload=()=>{s.dataset.ok='1';res()}; s.onerror=()=>rej(new Error('라이브러리를 불러오지 못했습니다(인터넷 연결 확인): '+src)); document.head.appendChild(s)})}
function parseNumTok(t){t=String(t).replace(/,/g,'').trim(); if(/^[그ㄱ]$/.test(t)) return null; return /^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):null}
/* 텍스트 줄 → 행. 줄 형식: 과목 시수 계산교원수 현원 정원 [증감] */
function parseHourLines(lines){
  const rows=[]; let totals=null;
  for(const line of lines){
    const toks=String(line).trim().split(/\s+/).filter(Boolean); if(!toks.length) continue;
    const joined=toks.join('');
    if(/평균/.test(joined)){let ns=toks.map(parseNumTok).filter(v=>v!==null); if(ns.length&&!Number.isInteger(ns[0])) ns=ns.slice(1); if(ns.length>=2) totals={a:ns[0],b:ns[1]}; continue}
    let i=0; const name=[]; while(i<toks.length&&parseNumTok(toks[i])===null){name.push(toks[i]);i++}
    const nm=name.join('').replace(/[^가-힣A-Za-z]/g,'');
    if(nm.length<2||/과목|시수|현원|정원|교원수|합계|지원청|학교/.test(nm)) continue;
    const ns=[]; for(;i<toks.length;i++){const v=parseNumTok(toks[i]); if(v!==null) ns.push(v)}
    if(ns.length>=4) rows.push({raw:nm,h:ns[0],calc:ns[1],a:ns[2],t:ns[3],diff:ns.length>=5?ns[4]:null});
    else if(ns.length>=2) rows.push({raw:nm,h:ns[0],t:ns[ns.length-1],cols:true});
  }
  return {rows,totals};
}
/* 엑셀 → 행 (머리글로 열 찾기, 없으면 줄 형식) */
function parseHourSheet(wb){
  for(const n of wb.SheetNames){
    const R=sheetRows(wb.Sheets[n]);
    const hi=R.findIndex(r=>r.some(c=>clean(c).includes('과목'))&&r.some(c=>clean(c).includes('시수')));
    if(hi<0) continue;
    const H=R[hi].map(clean); const f=p=>H.findIndex(p);
    const sc=f(x=>x.includes('과목')), hc=f(x=>x.includes('시수')&&!x.includes('평균')), cc=f(x=>x.includes('계산')), ac=f(x=>x.includes('현원')), bc=f(x=>x.includes('정원')&&!x.includes('과목'));
    if(sc<0||hc<0||bc<0) continue;
    const rows=[]; let totals=null;
    for(let i=hi+1;i<R.length;i++){const r=R[i]; const raw=clean(r[sc]).replace(/[^가-힣A-Za-z]/g,'');
      const line=r.map(String).join(' ');
      if(/평균|합계/.test(line)){const ns=[r[ac],r[bc]].map(num); totals={a:ns[0],b:ns[1]}; continue}
      if(!raw) continue;
      rows.push({raw,h:num(r[hc]),calc:cc>=0&&r[cc]!==''?num(r[cc]):null,a:ac>=0&&r[ac]!==''?num(r[ac]):null,t:num(r[bc]),diff:null});}
    if(rows.length) return {rows,totals,text:R.flat().join(' ')};
  }
  const all=wb.SheetNames.flatMap(n=>sheetRows(wb.Sheets[n]).map(r=>r.join(' ')));
  return Object.assign(parseHourLines(all),{text:all.join(' ')});
}
/* 이미지 전처리: 회색조 → 확대 → 흑백 */
function prepCanvas(src,th){
  const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height; const sc=Math.max(1,Math.min(2,4200/w));
  const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){const g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2]; const v=g>th?255:0; p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(d,0,0); return c;
}
async function getOcr(progress){
  await loadScript(LIB.tess);
  if(!window._ocrW){
    progress('글자 인식 엔진 준비 중… (처음 한 번만 수 MB를 내려받습니다)');
    window._ocrW=await Tesseract.createWorker('kor',1,{workerPath:LIB.tessw,corePath:LIB.tessc,
      logger:m=>{if(window._ocrP&&m.progress!=null) window._ocrP(m.status==='recognizing text'?`글자 인식 중 ${Math.round(m.progress*100)}%`:`엔진 준비 중 ${Math.round(m.progress*100)}%`)}});
  }
  window._ocrP=progress; return window._ocrW;
}
async function ocrSource(src,progress){
  const w=await getOcr(progress); let best=null;
  for(const tr of [{psm:'4',th:170},{psm:'6',th:200},{psm:'4',th:215}]){
    await w.setParameters({tessedit_pageseg_mode:tr.psm});
    const {data}=await w.recognize(prepCanvas(src,tr.th));
    const res=parseHourLines(data.text.split('\n')); res.text=data.text;
    const okN=checkHourRows(res).filter(r=>!r.msgs.length).length;
    if(!best||okN>best.okN) best=Object.assign(res,{okN});
    if(res.rows.length>=5&&okN===res.rows.length) break;
  }
  return best;
}
function fileToImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>res({im,url:u}); im.onerror=()=>rej(new Error('이미지를 열 수 없습니다')); im.src=u})}
async function pdfParse(file,progress){
  await loadScript(LIB.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines=[]; let nItems=0;
  for(let p=1;p<=Math.min(doc.numPages,3);p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent();
    const it=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:Math.round(i.transform[5])})); nItems+=it.length;
    it.sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null; it.forEach(i=>{if(!cur||Math.abs(cur.y-i.y)>3){cur={y:i.y,parts:[]};lines.push(cur)} cur.parts.push(i)});
  }
  if(nItems>=8){const L=lines.map(l=>l.parts.sort((a,b)=>a.x-b.x).map(p=>p.s).join(' ')); return Object.assign(parseHourLines(L),{text:L.join(' '),kind:'PDF'});}
  // 글자가 없는 PDF(스캔본) → 1쪽을 그림으로 바꿔 글자 인식
  progress('글자가 없는 PDF라 이미지로 바꿔 인식합니다…');

/* 행 검증 */
function checkHourRows(res){
  const rows=res.rows; const rat=rows.filter(r=>r.calc>0&&r.h>0).map(r=>r.h/r.calc).sort((a,b)=>a-b); const med=rat.length>=3?rat[Math.floor(rat.length/2)]:null;
  rows.forEach(r=>{
    r.msgs=[]; r.subject=r.subject||resolveSubject(r.raw,false)||'';
    if(!r.subject) r.msgs.push('처음 보는 과목 — 교과 확인');
    if(med&&r.calc>0&&Math.abs(r.h/r.calc-med)/med>0.04) r.msgs.push('시수가 계산교원수와 맞지 않음 — 숫자 확인');
    if(r.diff!=null&&r.a!=null&&Math.abs(Math.abs(r.a-r.t)-Math.abs(r.diff))>1e-9) r.msgs.push('현원−정원≠증감 — 정원 숫자 확인');
    if(r.cols) r.msgs.push('열 구성이 달라 시수·정원 위치 확인');
  });
  return rows;
}
function detectOtherSchool(text,sid){
  const t=clean(text); const me=schoolById(sid);
  for(const s of S.schools){ if(s.id===sid) continue; const full=fullSchoolName(s.name); if(t.includes(full)&&!t.includes(fullSchoolName(me.name))) return s.name; }
  return '';
}
/* 파일 1개 읽기 (공통) */
async function parseSchoolFile(sid,file,st){
  const ext=(file.name.split('.').pop()||'').toLowerCase(); let res, preview='';
  if(['xlsx','xls','csv'].includes(ext)){res=parseHourSheet(await readWorkbook(file)); res.kind='엑셀';}
  else if(ext==='pdf'){res=await pdfParse(file,st); preview=res.preview||'';}
  else if(/^(png|jpe?g|webp|bmp|gif)$/.test(ext)||(file.type||'').startsWith('image/')){const {im,url}=await fileToImage(file); res=await ocrSource(im,st); res.kind='이미지(글자 인식)'; preview=url;}
  else throw new Error('엑셀(.xlsx), PDF, 이미지(png·jpg) 파일만 올릴 수 있습니다.');
  if(!res.rows.length) throw new Error('표에서 「과목 · 시수 · 정원」을 찾지 못했습니다. 표 전체가 담겼는지 확인해 주세요.');
  checkHourRows(res);
  res.other=detectOtherSchool(res.text||'',sid);
  res.fileName=file.name; res.preview=preview;
  res.needConfirm=(res.kind!=='엑셀'&&res.kind!=='PDF') || res.rows.some(r=>r.msgs.length) || !!res.other || totalsMismatch(res);
  res.clean=!res.rows.some(r=>r.msgs.length)&&!res.other&&!totalsMismatch(res);
  return res;
}
async function handleSchoolFile(sid,file){

  let res; st('읽는 중…');

  else { applySchoolHours(sid,res.rows,{name:file.name,kind:res.kind}); renderSettings(); toast(`${nameOf(sid)} 수업시수를 반영했습니다 (${res.rows.length}개 과목)`); }
}
/* 파일명 → 학교 (가장 길게 일치하는 이름 우선) */
function matchSchoolByFileName(fname){
  const base=clean(String(fname).replace(/\.[^.]+$/,'')).replace(/[_\-()\[\]{}.,·~!@#$%^&+=]/g,'');
  const cands=[];
  S.schools.forEach(s=>{
    const vs=new Set([fullSchoolName(s.name), normSchoolName(s.name), s.name]);
    (s.aliases||'').split(',').map(a=>a.trim()).filter(Boolean).forEach(a=>{vs.add(clean(a)); vs.add(normSchoolName(a)); vs.add(fullSchoolName(a))});
    vs.forEach(v=>{ if(v) cands.push({id:s.id,v:clean(v),strong:true}) });
    const k=schoolKey(s.name); if(k&&k.length>=2) cands.push({id:s.id,v:k,strong:false});
  });
  cands.sort((a,b)=>b.v.length-a.v.length||(b.strong-a.strong));
  for(const c of cands){
    const i=base.indexOf(c.v); if(i<0) continue;
    return c.id;
  }
  return null;
}

}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function geoLog(t){S._geoLog=t; const el=$('#geoLog'); if(el){el.style.display='block'; el.textContent=t}}
async function geoMeasure(){
  const lines=[]; const log=s=>{lines.push(s); geoLog(lines.join('\n'))};
  const miss=S.schools.filter(s=>!S.geo.coords[s.id]);
  if(miss.length) log(`학교 위치 찾는 중… (${miss.length}교, 학교당 약 1초)`);
  let found=0; const failed=[];
  for(const s of miss){
    const qs=[s.addr, fullSchoolName(s.name)+' 시흥', fullSchoolName(s.name)].filter(Boolean);
    let ok=false;
    for(const q of qs){
      try{
        const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=kr&limit=1&accept-language=ko&viewbox=126.60,37.50,126.95,37.27&q=${encodeURIComponent(q)}`);
        const j=await r.json();
        if(j&&j[0]){S.geo.coords[s.id]={lat:+(+j[0].lat).toFixed(6),lng:+(+j[0].lon).toFixed(6),src:'자동: '+String(j[0].display_name||'').split(',').slice(0,3).join(',')}; ok=true;}
      }catch(e){log('위치 서버에 연결하지 못했습니다: '+e.message); break}
      await sleep(1100); if(ok) break;
    }
    if(ok) found++; else failed.push(s.name);
  }
  if(miss.length) log(`위치 찾기 완료: ${found}교 찾음${failed.length?` / 못 찾음: ${failed.join(', ')} → 「학교 위치」에서 주소나 좌표를 넣어 주세요`:''}`);
  const ids=S.schools.map(s=>s.id).filter(id=>S.geo.coords[id]);
  if(ids.length<2){log('위치가 2곳 이상 있어야 이동시간을 계산할 수 있습니다.'); save(); renderSettings(); return}
  log(`이동시간 계산 중… (${ids.length}교)`);
  try{
    const coords=ids.map(id=>`${S.geo.coords[id].lng},${S.geo.coords[id].lat}`).join(';');
    const r=await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?annotations=duration`);
    const j=await r.json(); if(j.code!=='Ok') throw new Error(j.message||j.code);
    S.geo.min={};
    ids.forEach((a,i)=>ids.forEach((b,k)=>{ if(i!==k&&j.durations[i][k]!=null) S.geo.min[a+'|'+b]=Math.max(1,Math.round(j.durations[i][k]/60)); }));
    S.geo.method='OSRM 자동차 경로'; S.geo.at=Date.now();
    log('이동시간 계산 완료 (OSRM 자동차 경로 기준, 신호·정체는 반영되지 않음)');
  }catch(e){
    log('경로 서버에 연결하지 못해 직선거리로 추정합니다: '+e.message); geoEstimate(true);
  }
  save(); renderSettings();
}
function geoEstimate(silent){
  const ids=S.schools.map(s=>s.id).filter(id=>S.geo.coords[id]);
  ids.forEach(a=>ids.forEach(b=>{if(a!==b&&S.geo.min[a+'|'+b]==null) S.geo.min[a+'|'+b]=estMin(a,b)}));
  S.geo.method=S.geo.method&&S.geo.method!=='직선거리 추정'?S.geo.method+' + 직선거리 추정':'직선거리 추정'; S.geo.at=Date.now();
  if(!silent){geoLog(`직선거리×1.35, 시속 28km로 추정했습니다 (${ids.length}교).`); save(); renderSettings();}
}

  const ids=Object.keys(map); if(!ids.length){alert('「학교명 | 권역」 짝을 찾지 못했습니다.');return}

  save(); renderSettings();
}

function readWorkbook(file){return new Promise((res,rej)=>{const fr=new FileReader(); fr.onload=e=>{try{res(XLSX.read(new Uint8Array(e.target.result),{type:'array'}))}catch(err){rej(err)}}; fr.onerror=rej; fr.readAsArrayBuffer(file)})}
const sheetRows=ws=>XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:true,raw:true});
async function uploadRequest(file){
  const wb=await readWorkbook(file);
  let rows=null,hr=-1;
  for(const n of wb.SheetNames){const r=sheetRows(wb.Sheets[n]); const i=r.findIndex(row=>row.some(c=>clean(c).includes('지원요청교'))&&row.some(c=>clean(c).includes('지원시행교'))); if(i>=0){rows=r;hr=i;break}}
  if(!rows){alert('「지원 요청교 / 지원 시행교」 머리글을 찾지 못했습니다. 순회교사 요청 현황 양식인지 확인해 주세요.');return}
  const H=rows[hr].map(clean);
  const ls=H.findIndex(x=>x.startsWith('지원요청교')&&x.includes('본교'));
  const rs=H.findIndex(x=>x.startsWith('지원시행교')&&x.includes('본교'));
  if(ls<0||rs<0){alert('「지원 요청교(본교)」 또는 「지원 시행교(본교)」 열을 찾지 못했습니다.');return}
  const block=(st,en)=>{const f=re=>{for(let c=st;c<en;c++) if(re.test(H[c])) return c; return -1};
    return {school:st,subject:f(/과목/),sem:f(/학기/),partner:f(/^지원(시행|요청)교$/),hours:f(/시수/),note:f(/비고/)}};
  const [a,b]=ls<rs?[ls,rs]:[rs,ls];
  const blkA=block(a,b), blkB=block(b,H.length);
  const needBlk=ls<rs?blkA:blkB, offBlk=ls<rs?blkB:blkA;
  const titleText=rows.slice(0,hr).flat().map(String).join(' ');
  const ym=titleText.match(/(20\d\d)\s*학년도/);
  const added=[],ext=new Set(),newSub=new Set();
  const subBefore=new Set(S.subjects.map(s=>s.name));
  const getSch=raw=>{const s=findSchool(raw); if(s) return s.id; const nm=normSchoolName(raw); const ns={id:'s'+(++S.seq),name:fullSchoolName(nm),zone:'미지정',avoid:false,aliases:clean(raw)!==nm?clean(raw):''}; S.schools.push(ns); added.push(nm); return ns.id};
  const getPartner=raw=>{if(!clean(raw)) return ''; const s=findSchool(raw); if(s) return s.id; const nm=normSchoolName(raw); ext.add(nm); return 'ext:'+nm};
  const parse=(blk)=>{const out=[];
    for(let i=hr+1;i<rows.length;i++){const r=rows[i]; const sc=clean(r[blk.school]), sub=clean(r[blk.subject]); const h=num(r[blk.hours]);
      if(!sc||!sub||h<=0) continue;
      const subj=resolveSubject(r[blk.subject]); if(!subBefore.has(subj)) newSub.add(subj);
      out.push({id:uid(),school:getSch(r[blk.school]),subject:subj,hours:h,sem:blk.sem>=0?clean(r[blk.sem]):'',partner:'',note:blk.note>=0?String(r[blk.note]||'').trim():''});}
    return out};
  const needs=parse(needBlk), offers=parse(offBlk);
  S._dirty=true;
  S.needs=needs; S.offers=offers;
  let rep=`파일: ${file.name}\n순회 요청 ${needs.length}건 (${fmt(needs.reduce((t,r)=>t+r.hours,0))}시간) · 지원 희망 ${offers.length}건 (${fmt(offers.reduce((t,r)=>t+r.hours,0))}시간)`;
  if(ym){rep+=`\n파일 학년도: ${ym[1]}`; if(+ym[1]!==S.year){S.year=+ym[1]; rep+=' → 학년도를 맞췄습니다'}}
  if(ext.size) rep+=`\n관외 학교(지정 상대교): ${[...ext].join(', ')}`;
  if(added.length) rep+=`\n학교 목록에 없어 새로 추가(권역 미지정): ${added.join(', ')} — 학교 관리에서 권역을 정하거나 기존 학교의 별칭으로 옮겨 주세요.`;
  if(newSub.size) rep+=`\n새 교과 추가: ${[...newSub].join(', ')}`;
  S.reqFile={name:file.name,at:Date.now(),report:rep};
  save(); renderSettings();
}
async function uploadHours(file){
  const wb=await readWorkbook(file);
  let rows=null,hr=-1;
  for(const n of wb.SheetNames){const r=sheetRows(wb.Sheets[n]); const i=r.findIndex(row=>row.some(c=>clean(c)==='구분')); if(i>=0&&r[i+1]&&r[i+1].some(c=>clean(c)==='시수')){rows=r;hr=i;break}}
  if(!rows){alert('「구분」 머리글과 「시수 / 교사수」 줄을 찾지 못했습니다.');return}
  const H=rows[hr],Sub=rows[hr+1]; const lc=H.findIndex(c=>clean(c)==='구분');
  const cols=[]; const unmatched=[];
  for(let c=0;c<H.length;c++){const nm=clean(H[c]); if(!nm||['구분','총','교사수','평균','계','합계'].includes(nm)) continue; if(clean(Sub[c])!=='시수') continue;
    const sc=findSchool(nm); if(!sc){unmatched.push(nm);continue}
    cols.push({id:sc.id,h:c,t:clean(Sub[c+1])==='교사수'?c+1:-1});}
  const data={},subs=[];
  for(let i=hr+2;i<rows.length;i++){const lab=clean(rows[i][lc]); if(!lab) continue; if(lab==='계'||lab==='합계') break;
    const sub=resolveSubject(lab); if(!subs.includes(sub)) subs.push(sub);
    cols.forEach(c=>{const h=num(rows[i][c.h]),t=c.t>=0?num(rows[i][c.t]):0; if(h||t){const m=(data[c.id]||(data[c.id]={})); const g=m[sub]||(m[sub]={h:0,t:0,d:[]}); g.h+=h; g.t+=t; g.d.push({raw:lab,h,t})}});}
  const title=clean(rows.slice(0,hr).flat().find(x=>clean(x))||'')?String(rows.slice(0,hr).flat().find(x=>clean(x))).trim():'학교별 교과별 수업시수';
  S._dirty=true;
  const prevData=(S.hours&&S.hours.data)||{}; Object.keys(data).forEach(id=>{S.hoursSrc=S.hoursSrc||{}; S.hoursSrc[id]={name:file.name,kind:'일괄 엑셀',at:Date.now()}});
  const merged=Object.assign({},prevData,data); const allSubs=[...new Set(Object.values(merged).flatMap(m=>Object.keys(m)))].sort((a,b)=>subjOrder(a)-subjOrder(b));
  S.hours={fileName:file.name,title,subjects:allSubs,data:merged,unmatched,report:`파일: ${file.name}\n학교 ${cols.length}교 · 교과 ${subs.length}개 (${subs.join(', ')})${unmatched.length?`\n찾지 못한 학교: ${unmatched.join(', ')}`:''}`};
  save(); renderSettings();
}

  else if(act==='hcDel'){readPendingFromModal(); PENDING.res.rows.splice(+t.dataset.i,1); checkHourRows(PENDING.res); openHoursConfirm(PENDING.sid,PENDING.res)}
  else if(act==='hcAdd'){readPendingFromModal(); PENDING.res.rows.push({raw:'',subject:S.subjects[0].name,h:0,t:0}); checkHourRows(PENDING.res); openHoursConfirm(PENDING.sid,PENDING.res)}
  else if(act==='hcApply'){readPendingFromModal(); const {sid,res,batchId}=PENDING; applySchoolHours(sid,res.rows,{name:res.fileName||'직접 수정',kind:res.kind||'직접 수정'}); PENDING=null; closeModal();
    if(batchId){const bi=BATCH.find(x=>x.id===batchId); if(bi){bi.status='반영됨'; bi.msg='확인 후 반영'} const nx=BATCH.find(x=>x.status==='확인 필요'&&x.res); if(nx){ if($('#drawer').classList.contains('on')) renderSettings(); toast(`${nameOf(sid)} 반영 — 다음 파일을 엽니다`); openBatchItem(nx); return; }} if($('#drawer').classList.contains('on')) renderSettings(); else renderAll(); toast(`${nameOf(sid)} 수업시수를 반영했습니다.`)}
  else if(act==='shView'){const id=t.dataset.id; const sr=(S.hoursSrc||{})[id]; let rows=sr&&sr.rows?sr.rows.map(r=>({...r})):Object.entries(S.hours.data[id]||{}).flatMap(([sub,v])=>(v.d&&v.d.length?v.d:[{raw:sub,h:v.h,t:v.t}]).map(d=>({raw:d.raw,subject:sub,h:d.h,t:d.t})));
    const res={rows,kind:sr?sr.kind:'일괄 엑셀',fileName:sr?sr.name:''}; checkHourRows(res); openHoursConfirm(id,res)}
  else if(act==='shDel'){const id=t.dataset.id; if(!confirm(`${nameOf(id)}의 수업시수 자료를 지울까요?`)) return; if(S.hours) {delete S.hours.data[id]; S.hours.subjects=[...new Set(Object.values(S.hours.data).flatMap(m=>Object.keys(m)))].sort((a,b)=>subjOrder(a)-subjOrder(b)); if(!Object.keys(S.hours.data).length) S.hours=null;} if(S.hoursSrc) delete S.hoursSrc[id]; S._dirty=true; save(); renderSettings()}
  else if(act==='batchAutoImg'){S.ui.batchAutoImg=t.checked; save()}
  else if(act==='batchClear'){BATCH=BATCH.filter(b=>b.status==='읽는 중'); renderBatch()}
  else if(act==='batchOpen'){openBatchItem(BATCH.find(b=>b.id===t.dataset.id))}
  else if(act==='batchNext'){openBatchItem(BATCH.find(b=>b.status==='확인 필요'&&b.res))}
  else if(act==='batchRetry'){const b=BATCH.find(x=>x.id===t.dataset.id); if(!b.sid){alert('먼저 학교를 선택하세요.');return} b.status='대기'; b.msg=''; b.dup=false; renderBatch(); runBatch()}
  else if(act==='geoMeasure'){t.disabled=true; t.textContent='측정 중…'; geoMeasure()}
  else if(act==='geoEstimate'){geoEstimate(false)}
  else if(act==='geoClear'){if(confirm('측정한 이동시간을 지울까요? (학교 위치는 남겨 둡니다)')){S.geo.min={};S.geo.method='';S.geo.at=null;S._geoLog='';save();renderSettings()}}
  else if(act==='resetPlan'){if(confirm('현재 학년도·학기의 배치를 모두 지울까요?')){setAssigns([]);VAR={key:'',list:[],idx:-1};save();renderSettings();toast('배치를 초기화했습니다.')}}
  else if(act==='resetData'){if(confirm('업로드한 요청 현황·수업시수 자료와 모든 배치를 지울까요?\n(학교·권역·교과·이동시간 설정은 남습니다)')){S.needs=[];S.offers=[];S.reqFile=null;S.hours=null;S.plans={};VAR={key:'',list:[],idx:-1};save();renderSettings();toast('자료와 배치를 초기화했습니다.')}}
  else if(act==='resetAll'){if(confirm('모든 설정과 자료, 배치를 지우고 처음 상태로 되돌릴까요?')){S=defaultState();save();renderSettings()}}
});
function addManual(from,to,sub,h){const ex=assigns().find(a=>a.from===from&&a.to===to&&a.subject===sub); if(ex){ex.hours+=h; ex.kind='manual'} else assigns().push({id:uid(),from,to,subject:sub,hours:h,kind:'manual'})}
function refreshPop(){if(!popCell) return; const td=document.querySelector(`[data-cell="${popCell.from}|${popCell.to}"]`); if(td){popCell.td=td; drawPop()} else closePop()}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.memo){const a=assigns().find(x=>x.id===t.dataset.memo); if(a){a.memo=t.value.trim(); save(); if(!$('#pop').contains(t)) renderAll(); else {renderAll(); refreshPop();}} return}
  if(t.dataset.rule){const v=num(t.value); if(v>0){S.rule[t.dataset.rule]=v; save(); renderSettings();} return}
  if(t.dataset.geo){const c=S.geo.coords[t.dataset.geo]||{}; const v=t.value.trim(); if(v===''){delete c[t.dataset.k]} else c[t.dataset.k]=num(v); c.src='직접 입력';
    if(c.lat!=null&&c.lng!=null) S.geo.coords[t.dataset.geo]=c; else if(c.lat==null&&c.lng==null) delete S.geo.coords[t.dataset.geo]; else S.geo.coords[t.dataset.geo]=c;
    save(); return}
  if(t.dataset.tm){const [a,b]=t.dataset.tm.split('|'); const v=t.value.trim(); if(v===''){delete S.geo.min[a+'|'+b]; delete S.geo.min[b+'|'+a]} else {S.geo.min[a+'|'+b]=S.geo.min[b+'|'+a]=Math.max(0,Math.round(num(v)))} if(!S.geo.method.includes('수정')) S.geo.method=(S.geo.method||'')+' (일부 직접 수정)'; save(); return}
  if(t.id==='upBatch'&&t.files.length){batchAdd(t.files); t.value=''; return}
  if(t.dataset.bsid!==undefined){const b=BATCH.find(x=>x.id===t.dataset.bsid); if(b){b.sid=t.value||null; if(b.res&&b.sid){b.res.other=detectOtherSchool(b.res.text||'',b.sid)} renderBatch()} return}
  if(t.dataset.shf&&t.files[0]){handleSchoolFile(t.dataset.shf,t.files[0]); t.value=''; return}
  if(t.id==='upZones'&&t.files[0]){uploadZones(t.files[0]).catch(err=>alert('파일을 읽지 못했습니다: '+err.message));return}
  if(t.dataset.pe==='sub'||t.dataset.pe==='h'){const a=assigns().find(x=>x.id===t.dataset.id); if(!a) return; if(t.dataset.pe==='sub') a.subject=t.value; else {const v=num(t.value); if(v<=0) return; a.hours=v} a.kind='manual'; renderAll(); refreshPop(); return}
  if(t.dataset.set==='year'){S.year=+t.value;save();renderSettings();return}
  if(t.dataset.set==='sem'){S.sem=t.value;save();renderSettings();return}
  if(t.dataset.sch){const s=schoolById(t.dataset.sch); if(!s) return; s[t.dataset.f]=t.dataset.f==='avoid'?t.checked:(t.dataset.f==='name'?t.value.trim():t.value); save(); return}
  if(t.dataset.subj!==undefined){const s=S.subjects[+t.dataset.subj]; if(!s) return; const old=s.name; s[t.dataset.f]=t.value.trim();
    if(t.dataset.f==='name'&&old!==s.name){[S.needs,S.offers,...Object.values(S.plans)].forEach(l=>l.forEach(r=>{if(r.subject===old) r.subject=s.name}))} save(); return}
  if(t.dataset.zone!==undefined){const i=+t.dataset.zone, old=S.zones[i], nv=t.value.trim(); if(!nv) return; S.zones[i]=nv; S.schools.forEach(s=>{if(s.zone===old) s.zone=nv}); save(); renderSettings(); return}
  if(t.id==='upReq'&&t.files[0]){uploadRequest(t.files[0]).catch(err=>alert('파일을 읽지 못했습니다: '+err.message));return}
  if(t.id==='upHours'&&t.files[0]){uploadHours(t.files[0]).catch(err=>alert('파일을 읽지 못했습니다: '+err.message));return}
  if(t.id==='upBackup'&&t.files[0]){const fr=new FileReader(); fr.onload=()=>{try{const o=JSON.parse(fr.result); const d=defaultState(); S=Object.assign(d,o); S.ui=Object.assign(d.ui,o.ui||{}); if(!Array.isArray(o.schools)) throw new Error('형식 오류'); migrate(); VAR={key:'',list:[],idx:-1}; save(); renderSettings(); toast('작업 파일을 불러왔습니다.')}catch(err){alert('작업 파일을 읽지 못했습니다.')}}; fr.readAsText(t.files[0]); return}
  if(t.id==='docDate'){S.docDate=t.value; save(); buildPrintPage(); return}
});
document.addEventListener('input',e=>{if(e.target.id==='notesTa'){S.notes=e.target.value; save(); buildPrintPage()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();closeModal();if($('#drawer').classList.contains('on')) closeSettings()}});
$('#gearBtn').addEventListener('click',openSettings);
document.addEventListener('dragover',e=>{const b=e.target.closest&&e.target.closest('[data-drop]'); if(b){e.preventDefault(); document.querySelectorAll('.shbox.drag,.upbox.drag').forEach(x=>x!==b&&x.classList.remove('drag')); b.classList.add('drag')}});
document.addEventListener('dragleave',e=>{const b=e.target.closest&&e.target.closest('[data-drop]'); if(b&&!b.contains(e.relatedTarget)) b.classList.remove('drag')});
document.addEventListener('drop',e=>{const b=e.target.closest&&e.target.closest('[data-drop]'); if(!b) return; e.preventDefault(); b.classList.remove('drag'); const fs=e.dataTransfer.files; if(!fs.length) return; if(b.dataset.drop==='__batch__'||fs.length>1){batchAdd(fs);return} handleSchoolFile(b.dataset.drop,fs[0])});
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')) e.preventDefault()});
$('#drawerClose').addEventListener('click',closeSettings);
$('#drawerBg').addEventListener('click',closeSettings);
$('#modalBg').addEventListener('click',closeModal);
window.addEventListener('resize',()=>{if(S.ui.tab==='print') fitPreview()});
window.addEventListener('beforeprint',()=>{ if(S.ui.tab!=='print'){S.ui.tab='print'; renderAll()} buildPrintPage(); });

load(); migrate(); autoIfReady(false); renderAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{if(S.ui.tab==='print'){fitPage();fitPreview()}});
</script>
</body>
</html>
